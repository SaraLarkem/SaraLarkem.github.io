<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Page Not Found — Sara Larkem</title>
    <style>
      :root {
        --bg: #07070a;
        --band: rgba(0, 0, 0, 0.72);
        --crimson: #b0454b;
        --text-muted: #8a909c;
        --gold: #b8956a;
        --gold-top: #d6b788;
        --gold-bottom: #a2825a;
        --ink: #17181d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 60% 40% at 50% 50%, rgba(90, 30, 34, 0.18), transparent 70%),
          var(--bg);
        color: var(--text-muted);
        font-family: 'Source Sans 3', system-ui, sans-serif;
        text-align: center;
        overflow: hidden;
      }

      main {
        width: 100%;
      }

      /* Dark horizontal band behind the message */
      .band {
        padding: 2.75rem 1rem 2.25rem;
        background: linear-gradient(
          180deg,
          transparent 0%,
          var(--band) 22%,
          var(--band) 78%,
          transparent 100%
        );
        animation: fade-in 2.4s ease-out both;
      }

      h1 {
        margin: 0;
        font-family: 'Cinzel', Georgia, serif;
        font-weight: 500;
        font-size: clamp(2rem, 8vw, 4.75rem);
        letter-spacing: 0.14em;
        color: var(--crimson);
        text-shadow: 0 0 32px rgba(158, 58, 63, 0.45);
        animation: settle 3s cubic-bezier(0.2, 0.6, 0.2, 1) both;
      }

      .code {
        margin: 0 0 0.75rem;
        font-family: 'Cinzel', Georgia, serif;
        font-size: 0.8125rem;
        letter-spacing: 0.4em;
        color: var(--gold);
        opacity: 0.7;
      }

      p.lore {
        margin: 1rem auto 0;
        max-width: 28rem;
        font-size: 1rem;
        font-style: italic;
      }

      .actions {
        margin-top: 2.25rem;
        animation: fade-in 1.2s ease-out 1.6s both;
      }

      a.btn {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink);
        background: linear-gradient(180deg, var(--gold-top), var(--gold) 48%, var(--gold-bottom));
        border: 1px solid var(--gold-bottom);
        border-radius: 0.2rem;
        text-shadow: 0 1px 0 rgba(255, 238, 205, 0.4);
        box-shadow:
          inset 0 1px 0 rgba(255, 240, 210, 0.55),
          0 0 22px rgba(214, 110, 52, 0.25);
        transition: filter 0.2s ease;
      }

      a.btn:hover {
        filter: brightness(1.08);
      }

      a.btn:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes settle {
        from {
          opacity: 0;
          letter-spacing: 0.24em;
        }
        to {
          opacity: 1;
          letter-spacing: 0.14em;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="band">
        <p class="code" aria-hidden="true">CDIV</p>
        <h1>Page Not Found</h1>
        <p class="lore">The path you followed has faded into the fog. Perhaps it never existed.</p>
      </div>
      <div class="actions">
        <a class="btn" href="/">Return to the bonfire</a>
      </div>
    </main>
  </body>
</html>
